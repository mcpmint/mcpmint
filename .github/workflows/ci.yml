name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-quality:
    name: App quality gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Generator tests
        run: npm run test:generator:unit

      - name: Parser fixture tests
        run: npm run test:parsers

      - name: API unit tests (SSRF helpers)
        run: npm run test:api

      - name: Workflow, accessibility, and trust tests
        run: npm run test:workflow

      - name: CLI behavior tests
        run: npm run test:cli

      - name: Dependency audit
        run: npm run audit:dependencies

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: phc_ci_public_fixture
          NEXT_PUBLIC_POSTHOG_HOST: https://us.i.posthog.com

      - name: Install Chromium for browser checks
        run: npx playwright install --with-deps chromium

      - name: Production browser and accessibility checks
        run: npm run test:browser

  cli-build:
    name: CLI build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cli/package-lock.json

      - name: Install CLI dependencies
        run: npm ci
        working-directory: cli

      - name: Build CLI bundle
        run: npm run build
        working-directory: cli

      - name: Audit CLI dependencies
        run: npm audit --audit-level=low
        working-directory: cli

  generated-projects:
    name: Generated project full verification
    runs-on: ubuntu-latest
    needs: app-quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: npm ci

      - name: Full generated Node and Python verification
        run: npm run test:generated:full
        env:
          MCPMINT_AUDIT_GENERATED: "1"
